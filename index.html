<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파트너 라이브 전용 드라이브 조회</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 36px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      background: #e8f0fe;
      color: #1a73e8;
      font-size: 12px;
      font-weight: 700;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    h2 { font-size: 22px; color: #212529; margin-bottom: 8px; }
    p.desc { font-size: 14px; color: #6c757d; margin-bottom: 24px; line-height: 1.5; }
    .field-group { text-align: left; margin-bottom: 16px; }
    .field-group label { display: block; font-size: 13px; font-weight: 600; color: #495057; margin-bottom: 6px; }
    input[type="date"], select {
      width: 100%;
      padding: 13px 14px;
      font-size: 15px;
      border: 1.5px solid #dee2e6;
      border-radius: 8px;
      outline: none;
      background: #fff;
    }
    button.submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: #1a73e8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button.submit-btn:hover { background: #1557b0; }
    #resultArea { margin-top: 24px; display: none; }
    .result-box {
      background: #f8f9fa;
      border: 1.5px solid #e9ecef;
      border-radius: 10px;
      padding: 20px;
      text-align: left;
    }
    .result-title { font-size: 13px; color: #868e96; margin-bottom: 4px; }
    .result-name { font-size: 16px; font-weight: 700; color: #212529; margin-bottom: 16px; word-break: break-all; }
    .open-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #20c997;
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      border-radius: 6px;
    }
    .msg-error { margin-top: 16px; font-size: 14px; color: #fa5252; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">파트너 라이브</span>
    <h2>전용 폴더 바로가기</h2>
    <p class="desc">편성된 방송 날짜와 시간을 선택하시면<br>해당 브랜드의 전용 드라이브 링크가 열립니다.</p>

    <div class="field-group">
      <label for="broadcastDate">방송 일자</label>
      <input type="date" id="broadcastDate">
    </div>

    <div class="field-group">
      <label for="broadcastTime">방송 시간</label>
      <select id="broadcastTime">
        <option value="">시간대를 선택하세요</option>
        <option value="12:00">12:00 (낮)</option>
        <option value="18:00">18:00 (퇴근)</option>
        <option value="20:00">20:00 (저녁)</option>
        <option value="22:00">22:00 (심야)</option>
      </select>
    </div>

    <button class="submit-btn" id="searchBtn" onclick="findDriveFolder()">조회하기</button>
    <div id="errorMsg" class="msg-error"></div>

    <div id="resultArea">
      <div class="result-box">
        <div class="result-title">브랜드 / 폴더명</div>
        <div class="result-name" id="folderTitle">-</div>
        <a href="#" target="_blank" id="driveLinkBtn" class="open-btn">📂 구글 드라이브 폴더 열기</a>
      </div>
    </div>
  </div>

  <script>
    // 복사한 '드라이브_링크공유' 탭의 CSV 웹 게시 링크 입력
    const SHEET_CSV_URL = https://docs.google.com/spreadsheets/d/e/2PACX-1vSJR2Da1fGj9Ut9FmjXzZMA-r56p07tjsjrhvENi1a7AfGmk3cXG8cUkJp4Z5DseR_pomAQXnnsIKkh/pub?gid=20260102&single=true&output=csv;

    async function findDriveFolder() {
      const dateInput = document.getElementById("broadcastDate").value.trim();
      const timeInput = document.getElementById("broadcastTime").value.trim();
      const errorMsg = document.getElementById("errorMsg");
      const resultArea = document.getElementById("resultArea");
      const searchBtn = document.getElementById("searchBtn");

      errorMsg.style.display = "none";
      resultArea.style.display = "none";

      if (!dateInput || !timeInput) {
        showError("방송 일자와 방송 시간을 모두 선택해 주세요.");
        return;
      }

      searchBtn.innerText = "조회 중...";
      searchBtn.disabled = true;

      try {
        const response = await fetch(SHEET_CSV_URL + "&t=" + new Date().getTime());
        if (!response.ok) throw new Error("시트 연결 실패");

        const text = await response.text();
        const lines = text.split(/\r?\n/);
        let matched = null;

        for (let i = 0; i < lines.length; i++) {
          const row = parseCSVRow(lines[i]);
          if (row.length < 7) continue;

          // 시트 구조: B열=일자, C열=시간, D열=브랜드, E열=폴더명, G열=드라이브URL
          const rDate = clean(row[1]);
          const rTime = clean(row[2]);
          const rBrand = clean(row[3]);
          const rFolder = clean(row[4]);
          const rUrl = clean(row[6]);

          if (rDate === dateInput && rTime.startsWith(timeInput) && rUrl.startsWith("http")) {
            matched = { brand: rBrand, folder: rFolder, url: rUrl };
            break;
          }
        }

        if (matched) {
          document.getElementById("folderTitle").innerText = `[${matched.brand}] ${matched.folder}`;
          document.getElementById("driveLinkBtn").href = matched.url;
          resultArea.style.display = "block";
        } else {
          showError("해당 일시에는 배정된 방송 및 전용 폴더가 없습니다.");
        }
      } catch (err) {
        showError("데이터를 불러오는 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
      } finally {
        searchBtn.innerText = "조회하기";
        searchBtn.disabled = false;
      }
    }

    function clean(str) { return str ? str.replace(/^"|"$/g, "").trim() : ""; }
    function showError(msg) {
      const el = document.getElementById("errorMsg");
      el.innerText = msg;
      el.style.display = "block";
    }
    function parseCSVRow(row) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < row.length; i++) {
        const char = row[i];
        if (char === '"' || char === "'") inQuotes = !inQuotes;
        else if (char === ',' && !inQuotes) { result.push(current); current = ''; }
        else current += char;
      }
      result.push(current);
      return result;
    }
  </script>
</body>
</html>
